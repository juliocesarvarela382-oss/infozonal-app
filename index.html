<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InfoZonal</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #111827;
    }

    header {
      background: #0b2d5c;
      color: white;
      padding: 22px 16px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      font-weight: 800;
    }

    header p {
      margin-top: 5px;
      font-size: 15px;
    }

    .contenedor {
      max-width: 700px;
      margin: auto;
      padding: 16px;
    }

    .boton {
      display: block;
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 12px;
      text-decoration: none;
      color: #111827;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .boton span {
      margin-right: 10px;
    }

    .destacado {
      background: #c8102e;
      color: white;
    }

    footer {
      text-align: center;
      padding: 25px 10px;
      color: #6b7280;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <h1>INFOZONAL</h1>
    <p>Noticias de Giles y la zona</p>
  </header>

  <main class="contenedor">

    <a class="boton destacado" href="#">
      📰 Últimas noticias
    </a>

    <a class="boton" href="#">
      🚨 Policiales
    </a>

    <a class="boton" href="#">
      🚒 Bomberos
    </a>

    <a class="boton" href="#">
      🌦️ Clima
    </a>

    <a class="boton" href="#">
      🕊️ Avisos fúnebres
    </a>

    <a class="boton" href="#">
      🏛️ Información local
    </a>

    <a class="boton" href="#">
      ⚽ Deportes
    </a>

    <a class="boton" href="#">
      📢 Publicidad
    </a>

    <a class="boton" href="#">
      📸 Enviar una noticia
    </a>

  </main>

  <footer>
    © 2026 InfoZonal · San Andrés de Giles y zona
  </footer>

</body>
</html>
